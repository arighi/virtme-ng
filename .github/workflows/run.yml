name: Run

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      ### DEPENDENCIES ###

      # Hard turn-off interactive mode
      - run: echo 'debconf debconf/frontend select Noninteractive' | sudo debconf-set-selections

      # Install dependencies
      - run: sudo apt-get update
      - run: |
          sudo apt-get install --yes --no-install-recommends \
             git qemu-system-x86 udev iproute2 busybox-static coreutils \
             python3-requests python3-argcomplete libvirt-clients kbd kmod \
             file rsync zstd virtiofsd

      # Ubuntu's patched Rust env can reject guest init execution via virtiofs.
      - name: "Use GNU env when available"
        run: |
          if [ -x /usr/bin/gnuenv ]; then
            sudo ln -sf gnuenv /usr/bin/env
          fi

      ### END DEPENDENCIES ###

      # Checkout git repository
      - uses: actions/checkout@v7

      # Run `uname -r` using a vanilla v6.6 kernel
      - run: ./vng -r v6.6 -v -- uname -r

      # Build virtme-ng-init
      - run: make

      # Setup KVM support
      - name: "KVM support"
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Re-run with KVM support and virtme-ng-init
      - name: "Check KVM support"
        run: |
          clocksource="/sys/devices/system/clocksource/clocksource0/current_clocksource"
          [ "$(./vng -r v6.6 -v -- cat "${clocksource}")" = "kvm-clock" ]

      # Capture the guest serial console to a file (KVM is available here)
      - name: "Check --serial-log"
        run: |
          rm -f /tmp/serial.log /tmp/stdout.log
          ./vng -r v6.6 --serial-log /tmp/serial.log -- \
            sh -c 'echo marker-ok' > /tmp/stdout.log
          # the log contains the boot log ...
          grep -q 'Linux version' /tmp/serial.log
          # ... the command output stays on stdout ...
          grep -q '^marker-ok$' /tmp/stdout.log
          # ... and the two are not mixed together
          ! grep -q 'marker-ok' /tmp/serial.log

      - name: "Python unit tests"
        timeout-minutes: 10
        run: |
          test -x virtme/guest/bin/virtme-ng-init

          # Reuse the downloaded kernel and exercise both guest init implementations.
          arch=$(dpkg --print-architecture)
          bzimage=$(printf '%s\n' "$HOME"/.cache/virtme-ng/v*/"${arch}"/boot/vmlinuz-* | sort -V | tail -n1)
          test -r "${bzimage}"

          VIRTME_TEST_KERNEL="${bzimage}" \
              python3 -m unittest discover -s tests -v
